<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trump Translator</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0a0a0a;color:#ccc;font-family:'IBM Plex Sans',sans-serif;min-height:100vh}
.hd{background:#CC0000;padding:12px 20px;border-bottom:4px solid #000;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px;position:sticky;top:0;z-index:100}
.logo{font-family:'Bebas Neue',sans-serif;font-size:38px;color:#fff;letter-spacing:2px;line-height:1}
.hd-sub{font-family:'IBM Plex Mono',monospace;font-size:10px;color:rgba(255,255,255,.55);text-transform:uppercase;letter-spacing:1px;margin-top:2px}
.hd-live{display:flex;align-items:center;gap:6px;font-family:'IBM Plex Mono',monospace;font-size:10px;color:rgba(255,255,255,.5);text-transform:uppercase;letter-spacing:1px}
.dotlive{width:7px;height:7px;border-radius:50%;background:#7fff7f;animation:pu 1.5s infinite;flex-shrink:0}
@keyframes pu{0%,100%{opacity:1}50%{opacity:.3}}
.page{display:flex;height:calc(100vh - 68px)}
.left{width:320px;flex-shrink:0;border-right:1px solid #1a1a1a;display:flex;flex-direction:column;overflow:hidden}
.right{flex:1;display:flex;flex-direction:column;overflow-y:auto}
.col-hd{background:#0d0d0d;border-bottom:1px solid #1e1e1e;padding:8px 13px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.lbl{font-family:'IBM Plex Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:2px;color:#444}
.lbl.r{color:#cc4444}
.lbl.p{color:#884499}
.toolbar{padding:7px 10px;display:flex;gap:6px;border-bottom:1px solid #161616;background:#080808;flex-shrink:0}
.srch{flex:1;background:#111;border:1px solid #1e1e1e;border-radius:3px;color:#ccc;font-family:'IBM Plex Mono',monospace;font-size:12px;padding:6px 9px;outline:none}
.srch::placeholder{color:#2a2a2a}
.srch:focus{border-color:#333}
.rbtn{font-family:'IBM Plex Mono',monospace;font-size:11px;color:#444;background:#111;border:1px solid #1e1e1e;padding:6px 10px;border-radius:3px;cursor:pointer;transition:all .15s}
.rbtn:hover{color:#aaa;border-color:#444}
.feed{flex:1;overflow-y:auto;min-height:0}
.feed::-webkit-scrollbar{width:3px}
.feed::-webkit-scrollbar-thumb{background:#1e1e1e}
.post{padding:10px 12px;border-bottom:1px solid #131313;cursor:pointer;border-left:3px solid transparent;transition:background .1s}
.post:hover{background:#131313}
.post.sel{background:#1a0707;border-left-color:#CC0000}
.pdate{font-family:'IBM Plex Mono',monospace;font-size:10px;color:#303030;margin-bottom:3px}
.pprev{font-size:12px;color:#666;line-height:1.5;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.pstats{display:flex;gap:10px;margin-top:5px}
.pstat{font-family:'IBM Plex Mono',monospace;font-size:10px;color:#222}
.fmsg{padding:14px;font-family:'IBM Plex Mono',monospace;font-size:12px;color:#444;line-height:1.7}
.fmsg.e{color:#663333}
.sel-box{padding:12px 14px;border-bottom:1px solid #1a1a1a;background:#0d0d0d;flex-shrink:0;min-height:68px}
.sel-ph{font-family:'IBM Plex Mono',monospace;font-size:12px;color:#222;font-style:italic}
.sel-tx{font-family:'IBM Plex Mono',monospace;font-size:12px;color:#777;line-height:1.5;max-height:88px;overflow:hidden}
.gobtn{width:100%;background:#CC0000;border:none;color:#fff;font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:3px;padding:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:background .15s;flex-shrink:0}
.gobtn:hover{background:#aa0000}
.gobtn:disabled{background:#151515;color:#222;cursor:not-allowed}
.divlbl{padding:7px 13px;font-family:'IBM Plex Mono',monospace;font-size:10px;color:#1e1e1e;text-transform:uppercase;letter-spacing:1px;border-bottom:1px solid #131313;background:#070707;flex-shrink:0}
.man{padding:12px 14px;display:flex;flex-direction:column;gap:7px;flex-shrink:0;border-bottom:1px solid #1a1a1a}
textarea{width:100%;background:#0e0e0e;border:1px solid #1a1a1a;border-radius:3px;color:#aaa;font-family:'IBM Plex Mono',monospace;font-size:12px;padding:9px;resize:vertical;outline:none;line-height:1.6;min-height:80px}
textarea::placeholder{color:#1e1e1e}
textarea:focus{border-color:#2a2a2a}
.usebtn{background:#131313;border:1px solid #1e1e1e;color:#444;font-family:'IBM Plex Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:1px;padding:8px;border-radius:3px;cursor:pointer;width:100%;transition:all .15s}
.usebtn:hover{border-color:#CC0000;color:#aaa}
.sec-hd{padding:7px 13px;font-family:'IBM Plex Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:2px;border-bottom:1px solid #1a1a1a;border-top:2px solid #CC0000;background:#0d0d0d;color:#553333}
.sec-hd.p{border-top-color:#661188;color:#552266;background:#0b090e}
.sec-hd.dr{border-top-color:#882222;color:#552222}
.rblock{padding:12px 14px;border-bottom:1px solid #131313}
.rlbl{font-family:'IBM Plex Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:2px;margin-bottom:6px;display:flex;align-items:center;gap:6px}
.rdot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.rtxt{font-size:13px;color:#999;line-height:1.75}
.lmw{padding:13px 14px;border-bottom:1px solid #131313}
.lmrow{display:flex;align-items:center;gap:13px;margin-bottom:9px}
.lmnum{font-family:'Bebas Neue',sans-serif;font-size:48px;line-height:1;min-width:62px}
.lmv{font-family:'IBM Plex Mono',monospace;font-size:12px;text-transform:uppercase;letter-spacing:1px;font-weight:500}
.lmd{font-family:'IBM Plex Mono',monospace;font-size:11px;color:#383838;margin-top:3px}
.lmtrack{height:7px;background:#131313;border-radius:4px;overflow:hidden;margin-bottom:12px}
.lmfill{height:100%;border-radius:4px;transition:width .8s ease}
.claims{display:flex;flex-direction:column;gap:6px}
.claim{background:#0d0d0d;border-radius:3px;padding:8px 10px;border-left:3px solid #1e1e1e}
.claim.true{border-left-color:#1f5530}
.claim.false{border-left-color:#771a1a}
.claim.misleading{border-left-color:#775520}
.claim.unverifiable{border-left-color:#223366}
.vtag{font-family:'IBM Plex Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:1px;padding:2px 6px;border-radius:2px;display:inline-block;margin-bottom:3px}
.vtag.true{background:#111e14;color:#40a050}
.vtag.false{background:#1e1111;color:#bb4040}
.vtag.misleading{background:#1e1a10;color:#bb8020}
.vtag.unverifiable{background:#111220;color:#5566aa}
.claimt{font-size:12px;color:#777;line-height:1.5}
.claimd{font-size:11px;color:#383838;line-height:1.5;margin-top:3px;font-style:italic}
.spinw{padding:12px 14px}
.spinitem{background:#0d0d0d;border-radius:3px;padding:9px 11px;border-left:3px solid #3a1055;margin-bottom:6px}
.spinitem:last-child{margin-bottom:0}
.spinwho{font-family:'IBM Plex Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:1px;color:#662288;margin-bottom:4px}
.spintxt{font-size:12px;color:#777;line-height:1.6}
.c0{color:#40b060}.c1{color:#80b040}.c2{color:#b0a020}.c3{color:#d08010}.c4{color:#c04010}.c5{color:#aa1a1a}
.b0{background:#40b060}.b1{background:#80b040}.b2{background:#b0a020}.b3{background:#d08010}.b4{background:#c04010}.b5{background:#aa1a1a}
.spin2{width:12px;height:12px;border:2px solid #2a2a2a;border-top-color:#CC0000;border-radius:50%;animation:sp .7s linear infinite;display:inline-block;flex-shrink:0}
@keyframes sp{to{transform:rotate(360deg)}}
.loading{display:flex;align-items:center;gap:8px;padding:13px;font-family:'IBM Plex Mono',monospace;font-size:12px;color:#383838}
@media(max-width:640px){
  .page{flex-direction:column;height:auto}
  .left{width:100%;height:280px;border-right:none;border-bottom:1px solid #1a1a1a}
  .right{flex:none}
}
</style>
</head>
<body>
<div class="hd">
  <div>
    <div class="logo">Trump Translator</div>
    <div class="hd-sub">Live feed · Select · Decode · No account needed</div>
  </div>
  <div class="hd-live"><div class="dotlive"></div>CNN / Truth Social · live</div>
</div>

<div class="page">
  <div class="left">
    <div class="col-hd">
      <div class="lbl">Posts <span id="fc" style="color:#222;margin-left:5px"></span></div>
      <button class="rbtn" onclick="loadFeed()">↻ Refresh</button>
    </div>
    <div class="toolbar">
      <input class="srch" id="srch" type="text" placeholder="Filter..." oninput="filterPosts()">
    </div>
    <div class="feed" id="feedList">
      <div class="loading"><div class="spin2"></div><span>Loading...</span></div>
    </div>
  </div>

  <div class="right">
    <div class="col-hd"><div class="lbl r">Selected for translation</div></div>
    <div class="sel-box">
      <div id="selDisplay" class="sel-ph">← Select a post, or paste below</div>
    </div>
    <button class="gobtn" id="gobtn" onclick="doTranslate()" disabled>Translate</button>
    <div class="divlbl">— or paste any statement manually —</div>
    <div class="man">
      <textarea id="manual" placeholder="Paste any Trump statement, Truth Social post, speech excerpt..."></textarea>
      <button class="usebtn" onclick="useManual()">Use this text ↑</button>
    </div>
    <div id="results"></div>
  </div>
</div>

<script>
let posts=[],selText='';
function strip(h){return(h||'').replace(/<[^>]+>/g,' ').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&#39;/g,"'").replace(/\s+/g,' ').trim();}
function fmtN(n){if(!n)return'0';return n>=1000?(n/1000).toFixed(1)+'k':String(n);}
function fmtD(iso){const d=new Date(iso);return d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'2-digit'})+' '+d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});}
function sc(s){return String(Math.min(5,Math.max(0,Math.round(s))));}
const VD=['Mostly True','Selective Truth','Misleading','Mostly False','Egregiously False','Pathological'];
const DD=['Claims broadly accurate','True elements with key omissions','Technically possible, practically deceptive','Core assertions lack factual basis','Directly contradicted by evidence','Statements invert documented reality'];

async function loadFeed(){
  document.getElementById('feedList').innerHTML='<div class="loading"><div class="spin2"></div><span>Fetching posts...</span></div>';
  document.getElementById('fc').textContent='';
  let data=null;
  try{const r=await fetch('/api/feed');if(r.ok)data=await r.json();}catch(e){}
  if(!data||!data.length){
    document.getElementById('feedList').innerHTML='<div class="fmsg e">Feed unavailable.<br>Use manual paste below.</div>';
    return;
  }
  posts=data.filter(p=>strip(p.content).length>20).slice(0,100);
  document.getElementById('fc').textContent='('+posts.length+')';
  renderPosts(posts);
}

function renderPosts(list){
  const el=document.getElementById('feedList');
  if(!list.length){el.innerHTML='<div class="fmsg">No posts match.</div>';return;}
  el.innerHTML=list.map((p,i)=>`<div class="post" id="pi${i}" onclick="pick(${i})">
    <div class="pdate">${fmtD(p.created_at)}</div>
    <div class="pprev">${strip(p.content)}</div>
    <div class="pstats"><span class="pstat">↺${fmtN(p.reblogs_count)}</span><span class="pstat">♡${fmtN(p.favourites_count)}</span></div>
  </div>`).join('');
}

function filterPosts(){
  const q=document.getElementById('srch').value.toLowerCase();
  renderPosts(q?posts.filter(p=>strip(p.content).toLowerCase().includes(q)):posts);
}

function pick(i){
  document.querySelectorAll('.post').forEach(e=>e.classList.remove('sel'));
  const el=document.getElementById('pi'+i);
  if(el){el.classList.add('sel');el.scrollIntoView({block:'nearest'});}
  setSelected(strip(posts[i].content));
}

function useManual(){
  const t=document.getElementById('manual').value.trim();
  if(!t)return;
  document.querySelectorAll('.post').forEach(e=>e.classList.remove('sel'));
  setSelected(t);
}

function setSelected(t){
  selText=t;
  const pr=t.length>240?t.substring(0,240)+'…':t;
  document.getElementById('selDisplay').className='sel-tx';
  document.getElementById('selDisplay').textContent=pr;
  document.getElementById('gobtn').disabled=false;
  document.getElementById('results').innerHTML='';
}


const LM=['Analyzing...','Checking facts...','Calibrating meter...','Mapping targets...'];
let lmi=0,lmt;
function startL(el){lmi=0;el.textContent=LM[0];lmt=setInterval(()=>{lmi=(lmi+1)%LM.length;el.textContent=LM[lmi];},1800);}
function stopL(){clearInterval(lmt);}

async function doTranslate(){
  if(!selText)return;
  const btn=document.getElementById('gobtn');
  btn.disabled=true;
  btn.innerHTML='<div class="spin2" style="border-top-color:#fff;margin-right:6px"></div>Translating...';
  const res=document.getElementById('results');
  const ld=document.createElement('div');
  ld.className='loading';
  ld.innerHTML='<div class="spin2"></div><span id="lmtxt">Analyzing...</span>';
  res.innerHTML='';
  res.appendChild(ld);
  startL(document.getElementById('lmtxt'));
  try{
    const r=await fetch('/api/translate',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({text:selText})
    });
    stopL();
    if(!r.ok){const e=await r.text();throw new Error('Translate API '+r.status+': '+e.substring(0,120));}
    const p=await r.json();
    if(p.error)throw new Error(p.error);
    renderResults(p);
  }catch(e){
    stopL();
    res.innerHTML=`<div class="fmsg e">Error: ${e.message}</div>`;
  }
  btn.disabled=false;
  btn.innerHTML='Translate';
}

function renderResults(p){
  const score=Math.min(5,Math.max(0,parseFloat(p.score)||0));
  const si=Math.round(score);
  const scs=sc(score);
  document.getElementById('results').innerHTML=`
    <div class="sec-hd">Decoded output</div>
    <div class="rblock"><div class="rlbl"><span class="rdot" style="background:#40b060"></span><span style="color:#40b060;font-family:'IBM Plex Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:2px">Plain English</span></div><div class="rtxt">${p.plain||'—'}</div></div>
    <div class="rblock"><div class="rlbl"><span class="rdot" style="background:#d09020"></span><span style="color:#d09020;font-family:'IBM Plex Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:2px">Market Signal</span></div><div class="rtxt">${p.market||'—'}</div></div>
    <div class="rblock"><div class="rlbl"><span class="rdot" style="background:#3070d0"></span><span style="color:#3070d0;font-family:'IBM Plex Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:2px">Geopolitical Move</span></div><div class="rtxt">${p.geo||'—'}</div></div>
    <div class="sec-hd dr">Lies Meter</div>
    <div class="lmw">
      <div class="lmrow"><div class="lmnum c${scs}">${score.toFixed(1)}</div><div><div class="lmv c${scs}">${p.verdict||VD[si]}</div><div class="lmd">${DD[si]}</div></div></div>
      <div class="lmtrack"><div class="lmfill b${scs}" style="width:${(score/5*100).toFixed(0)}%"></div></div>
      <div class="claims">${(p.claims||[]).map(c=>{const v=(c.verdict||'unverifiable').toLowerCase();return`<div class="claim ${v}"><span class="vtag ${v}">${v}</span><div class="claimt">${c.text||''}</div><div class="claimd">${c.detail||''}</div></div>`;}).join('')}</div>
    </div>
    <div class="sec-hd p">Spin Decoded</div>
    <div class="spinw">${(p.spin||[]).map(s=>`<div class="spinitem"><div class="spinwho">→ ${s.audience||''}</div><div class="spintxt">${s.why||''}</div></div>`).join('')}</div>
  `;
  document.getElementById('results').scrollIntoView({behavior:'smooth',block:'start'});
}

loadFeed();
</script>
</body>
</html>
